services:
  catalogdb:
    image: postgres:16
  basketdb:
    image: postgres:16
  distributedcache:
    image: redis
  catalog.api:
    image: ${DOCKER_REGISTRY-}catalog.api
    build:
      context: ..
      dockerfile: Services/Catalog/DockerFile
  basket.api:
    image: ${DOCKER_REGISTRRY-}basket.api
    build:
      context: ..
      dockerfile: Services/Basket/DockerFile
  discount.grpc:
    image: ${DOCKER_REGISTRRY-}discount.grpc
    build:
      context: ..
      dockerfile: Services/Discount/DockerFile

volumes:
  postgres_catalog:
  postgres_catalog_fresh:
  postgres_basket: