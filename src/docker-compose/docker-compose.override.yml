
services:
  # =========================
  # DATABASES
  # =========================

  catalogdb:
    container_name: catalogdb
    environment:
      POSTGRES_USER: nguyenhoangphuc
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: CatalogDb
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres_catalog_fresh:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nguyenhoangphuc -d CatalogDb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  basketdb:
    container_name: basketdb
    environment:
      POSTGRES_USER: nguyenhoangphuc
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: BasketDb
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/data

  # =========================
  # REDIS
  # =========================

  distributedcache:
    container_name: distributedcache
    restart: always
    ports:
      - "6379:6379"

  # =========================
  # CATALOG API
  # =========================

  catalog.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8081

      ConnectionStrings__Database: "Host=catalogdb;Port=5432;Database=CatalogDb;Username=nguyenhoangphuc;Password=123;Include Error Detail=true"

      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/catalog.api.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${HTTPS_CERT_PASSWORD}

    depends_on:
      catalogdb:
        condition: service_healthy

    ports:
      - "6000:8080"
      - "6060:8081"

    volumes:
      - ${APPDATA:-./.appdata}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA:-./.appdata}/ASP.NET/Https:/home/app/.asp/https:ro
      - ${HOME}/.aspnet/https:/https:ro

  # =========================
  # BASKET API
  # =========================

  basket.api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8081

      ConnectionStrings__Database: "Host=basketdb;Port=5432;Database=BasketDb;Username=nguyenhoangphuc;Password=123;Include Error Detail=true"
      ConnectionStrings__Redis: "distributedcache:6379"

      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/basket.api.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${HTTPS_CERT_PASSWORD}

      GrpcSettings_DiscountUrl: http://discount.grpc:8080

    depends_on:
      - basketdb
      - distributedcache
      - discount.grpc

    ports:
      - "6001:8080"
      - "6061:8081"

    volumes:
      - ${APPDATA:-./.appdata}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA:-./.appdata}/ASP.NET/Https:/home/app/.asp/https:ro
      - ${HOME}/.aspnet/https:/https:ro

  # =========================
  # DISCOUNT gRPC
  # =========================

  discount.grpc:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_HTTPS_PORTS: 8081

      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/discount.grpc.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${HTTPS_CERT_PASSWORD}

      ConnectionStrings__Database: "Data Source=discountdb"

    ports:
      - "6002:8080"
      - "6062:8081"

    volumes:
      - ${APPDATA:-./.appdata}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA:-./.appdata}/ASP.NET/Https:/home/app/.asp/https:ro
      - ${HOME}/.aspnet/https:/https:ro

# =========================
# PERSISTENT VOLUMES
# =========================

volumes:
  postgres_catalog_fresh:
  postgres_basket:
